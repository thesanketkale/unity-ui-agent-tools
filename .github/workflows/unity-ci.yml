name: Unity Editor CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Packages/io.github.thesanketkale.ui-context/**'
      - 'Projects/Sample/**'

concurrency:
  group: unity-ci-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  unity-editmode-tests:
    name: Unity EditMode In-Editor Tests
    if: vars.UNITY_CI == 'true'
    runs-on: [self-hosted, unity, windows]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Run EditMode Tests via Batchmode
        shell: pwsh
        run: |
          $Project = "Projects/Sample"
          $Results = "TestResults/editmode-results.xml"
          New-Item -ItemType Directory -Path "TestResults" -Force | Out-Null
          
          & "$env:UNITY_PATH" -batchmode -nographics -projectPath $Project -runTests -testPlatform EditMode -testResults $Results -logFile "TestResults/unity.log"
          
          if ($LASTEXITCODE -ne 0) {
            Get-Content "TestResults/unity.log" -Tail 50
            exit $LASTEXITCODE
          }
          Write-Host "Unity EditMode tests PASSED."
