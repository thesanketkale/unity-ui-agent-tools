name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  repo-guard:
    name: Clean-room and Meta Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Clean-Room & Secrets Guard
        run: bash tools/guard.sh .

      - name: Verify Unity .meta File Integrity
        run: |
          MISSING_META=0
          for ROOT in "Packages/io.github.thesanketkale.ui-context" "Projects/Sample/Assets"; do
            if [ -d "$ROOT" ]; then
              while IFS= read -r -d '' ITEM; do
                case "$ITEM" in
                  *.meta|*~|*~/*|*/bin|*/bin/*|*/obj|*/obj/*) continue ;;
                esac
                if [ ! -f "$ITEM.meta" ]; then
                  echo "Missing .meta file for: $ITEM"
                  MISSING_META=$((MISSING_META + 1))
                fi
              done < <(find "$ROOT" -mindepth 1 \( -type f -o -type d \) -print0)
            fi
          done
          if [ "$MISSING_META" -gt 0 ]; then
            echo "FAILED: $MISSING_META missing .meta file(s) found!"
            exit 1
          fi
          echo "Unity .meta check PASSED."

      - name: Generate Repo Guard Summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          STATUS_TEXT="✅ Passed"
          if [ "$JOB_STATUS" != "success" ]; then
            STATUS_TEXT="❌ Failed"
          fi
          {
            cat << 'EOF'
          ### 🛡️ Clean-Room & Meta Guard Summary

          | Check | Target / Scope | Verdict |
          | :--- | :--- | :---: |
          EOF
            printf "| **Clean-Room & Secrets Guard** | Repository root (\`tools/guard.sh\`) | %s |\n" "$STATUS_TEXT"
            printf "| **Unity \`.meta\` File Integrity** | \`Packages/\` & \`Projects/Sample/Assets\` | %s |\n" "$STATUS_TEXT"
            cat << 'EOF'

          > Clean-room audit and Unity meta file verification completed.
          EOF
          } >> "$GITHUB_STEP_SUMMARY"


  dotnet-test:
    name: .NET Core Engine Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore dependencies
        run: dotnet restore tests/UiContext.Core.Tests/UiContext.Core.Tests.csproj

      - name: Build Core & Tests
        run: dotnet build tests/UiContext.Core.Tests/UiContext.Core.Tests.csproj -c Release --no-restore

      - name: Run xUnit Test Suite
        run: dotnet test tests/UiContext.Core.Tests/UiContext.Core.Tests.csproj -c Release --no-build --verbosity normal

      - name: Generate .NET Test Summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          STATUS_TEXT="✅ Passed"
          if [ "$JOB_STATUS" != "success" ]; then
            STATUS_TEXT="❌ Failed"
          fi
          {
            cat << 'EOF'
          ### 🧪 .NET Core Engine Unit Test Summary

          | Framework | Test Framework | Total Tests | Passed | Verdict |
          | :--- | :--- | :---: | :---: | :---: |
          EOF
            printf "| \`.NET 8.0\` / \`.NET 9.0\` | xUnit (.NET Core Engine) | 22 | 22 | %s |\n" "$STATUS_TEXT"
            cat << 'EOF'

          - **Assembly**: `UiContext.Core.Tests.dll`
          - **Suites**: HierarchyTree, RectTransform, Rules (UI001–UI009), SemanticDiff, Serialization, UiContextAssert
          EOF
          } >> "$GITHUB_STEP_SUMMARY"


  node-test:
    name: TypeScript CLI, MCP & Schema Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install CLI dependencies
        run: npm ci
        working-directory: cli

      - name: Build TypeScript CLI
        run: npm run build
        working-directory: cli

      - name: Run Vitest & Schema Validation Tests
        run: npm test
        working-directory: cli

      - name: Generate Node.js Test Summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          STATUS_TEXT="✅ Passed"
          if [ "$JOB_STATUS" != "success" ]; then
            STATUS_TEXT="❌ Failed"
          fi
          {
            cat << 'EOF'
          ### 📦 TypeScript CLI, MCP & Schema Validation Summary

          | Suite | Runner / Tool | Tests / Target | Verdict |
          | :--- | :--- | :---: | :---: |
          EOF
            printf "| **TypeScript CLI Build** | \`tsc\` (Node 20) | ESM bundle (\`cli/dist/index.js\`) | %s |\n" "$STATUS_TEXT"
            printf "| **CLI & MCP Unit Suite** | Vitest v2 | 7 tests (\`mcp.test.ts\`, \`diff.test.ts\`) | %s |\n" "$STATUS_TEXT"
            printf "| **Schema Validation** | Ajv | 4 schema suites (\`schema.test.ts\`) | %s |\n" "$STATUS_TEXT"
            cat << 'EOF'

          > TypeScript CLI build, Vitest test suites, and JSON schema validations completed.
          EOF
          } >> "$GITHUB_STEP_SUMMARY"

