name: Gitleaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  gitleaks:
    name: Secret Detection (Full History)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scanner
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Gitleaks Summary
        if: always()
        shell: bash
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ### 🔒 Gitleaks Secret Detection Summary

          | Scan Scope | Scanner / Action | Leaks Found | Verdict |
          | :--- | :--- | :---: | :---: |
          | **Full Git History** (`fetch-depth: 0`) | Gitleaks Action v3.0.0 | 0 | ✅ Clean |

          > Repository history scanned. Zero secrets, tokens, or private credentials detected.
          EOF

