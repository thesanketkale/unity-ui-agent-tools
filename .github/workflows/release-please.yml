name: Release Please

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    name: Automated Release & SemVer Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@7987452d56ee513710370b349b1ce55452a8b98b # v4.1.4
        with:
          release-type: node
          package-name: io.github.thesanketkale.ui-context
